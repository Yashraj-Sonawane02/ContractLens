name: ContractLens CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: contractlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install fastapi uvicorn sqlalchemy psycopg2-binary pydantic-settings cryptography slowapi sentry-sdk boto3 pytest httpx python-multipart

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/contractlens_test
          SECRET_KEY: ci_cd_test_secret_key_2026
          STORAGE_ENCRYPTION_KEY: gAAAAABl-sample-fernet-key-32bytes-secret-devkey=
        run: |
          python -m pytest backend/tests -v

      - name: Run RAG Statutory Mapping Check
        run: |
          python backend/test_rag_mapping.py

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Build Frontend Production Artifact
        working-directory: ./frontend
        run: |
          npm run build
